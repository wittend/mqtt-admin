# Add to /etc/mosquitto/conf.d/dynsec.conf in the Mosquitto container.
#
# Find the real plugin path first:
#   find / -name mosquitto_dynamic_security.so 2>/dev/null
# Debian/Ubuntu: /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
allow_anonymous false

plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Remove any password_file and acl_file lines from mosquitto.conf and conf.d/.
# dynsec replaces them, and two sources of truth for passwords is how lockouts happen.
