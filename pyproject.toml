[project]
name = "mqtt-admin"
version = "0.1.0"
description = "Web interface for managing Mosquitto users and passwords through the dynamic-security plugin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "paho-mqtt>=2.0",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqtt_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
